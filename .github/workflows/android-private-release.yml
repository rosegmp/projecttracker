name: Publish private Android release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: android-private-release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Require the protected main branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "::error::Private Android releases must run from main"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require successful exact-main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --branch main \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 10 \
            --json databaseId,status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty')
          if [ -z "$CI_RUN_ID" ]; then
            echo "::error::The exact main commit has not passed the complete push-triggered CI workflow"
            exit 1
          fi
          echo "Using successful exact-main CI run $CI_RUN_ID"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Configure Firebase Android client
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not configured"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build production web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_KEY" ]; then
            echo "::error::Supabase Android client configuration is missing"
            exit 1
          fi
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore and validate release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ] || [ -z "$ANDROID_RELEASE_STORE_PASSWORD" ] || [ -z "$ANDROID_RELEASE_KEY_ALIAS" ]; then
            echo "::error::Android release keystore configuration is missing"
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/project-tracker-release.jks"
          chmod 600 "$RUNNER_TEMP/project-tracker-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/project-tracker-release.jks" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/project-tracker-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Android release key password is missing"
            exit 1
          fi
          chmod +x android/gradlew
          ./android/gradlew --no-daemon -p android assembleRelease

      - name: Verify and name release APK
        id: release
        run: |
          set -euo pipefail
          SOURCE_APK='android/app/build/outputs/apk/release/app-release.apk'
          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::Signed release APK was not produced"
            exit 1
          fi
          apksigner verify --verbose "$SOURCE_APK" > /dev/null

          BUNDLED_JS="$RUNNER_TEMP/project-tracker-bundled.js"
          unzip -p "$SOURCE_APK" 'assets/public/assets/*.js' > "$BUNDLED_JS"
          if ! grep -Eq 'https://[a-z0-9-]+\.supabase\.co' "$BUNDLED_JS"; then
            echo "::error::Release APK is missing its Supabase project URL"
            exit 1
          fi
          if ! grep -Eq 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|sb_publishable_[A-Za-z0-9_-]+' "$BUNDLED_JS"; then
            echo "::error::Release APK is missing its Supabase client key"
            exit 1
          fi

          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName "([^"]+)"/\1/p' android/app/build.gradle)
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+)/\1/p' android/app/build.gradle)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Android release version could not be read"
            exit 1
          fi

          RELEASE_APK="Destiny-Project-Hub-${VERSION_NAME}.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"
          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "checksum=${RELEASE_APK}.sha256" >> "$GITHUB_OUTPUT"
          echo "tag=android-v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload retained release artifact
        uses: actions/upload-artifact@v7
        with:
          name: project-tracker-android-release-${{ steps.release.outputs.tag }}
          path: |
            ${{ steps.release.outputs.apk }}
            ${{ steps.release.outputs.checksum }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APK: ${{ steps.release.outputs.apk }}
          RELEASE_CHECKSUM: ${{ steps.release.outputs.checksum }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::GitHub release $RELEASE_TAG already exists; increment versionCode and versionName before releasing again"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$RELEASE_APK" \
            "$RELEASE_CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Destiny Project Hub ${RELEASE_TAG#android-v}" \
            --notes "Private signed Android release. Version code: $VERSION_CODE. Built from protected main commit $GITHUB_SHA after regression, configuration, signature, and bundled Supabase checks."

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/project-tracker-release.jks" "$RUNNER_TEMP/project-tracker-bundled.js"
