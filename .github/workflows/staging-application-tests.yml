name: Staging application authorization tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-application-authorization
  cancel-in-progress: false

jobs:
  staging:
    name: Disposable staging authorization suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run disposable staging suite
        run: npm run test:staging
