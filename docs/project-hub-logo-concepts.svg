<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="title description">
  <title id="title">Four new Project Hub logo directions</title>
  <desc id="description">Blueprint, Waypoint, Keystone, and Momentum logo concepts shown with icons and wordmarks.</desc>
  <rect width="960" height="550" fill="#EDF3F7"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
